# Extra Electron flags for Obsidian, read by /usr/bin/obsidian.
#
# us(intl): make ' + c give ç rather than ć. On native Wayland, Electron 43
# (Chromium 150) gives ć even with --disable-wayland-ime (the fix that works
# for claude-desktop-flags.conf). Under XWayland, dead keys go through the X11
# input path, which uses XCOMPOSEFILE / gtk-3.0/Compose. The monitor runs at
# scale 1, so XWayland doesn't blur the window.
--ozone-platform=x11
