# Extra Electron flags for Claude Desktop, read by /usr/bin/claude-desktop.
#
# us(intl): make ' + c give ç rather than ć. On Wayland the launcher passes
# --enable-wayland-ime, which routes keys through text-input-v3; with no IME
# running, Chromium then composes dead keys with its own built-in en_US table
# and ignores both XCOMPOSEFILE and ~/.config/gtk-{3,4}.0/Compose. Disabling it
# falls back to GTK's input method, which reads the gtk Compose files.
--disable-wayland-ime
