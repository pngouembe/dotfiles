# SDDM settings -> /etc/sddm.conf.d/10-caelestia.conf
#
# Installed by scripts/setup-sddm.sh; see docs/login-sddm.md.

[Theme]
# From the AUR (paru -S sddm-astronaut-theme). Its colours, font and wallpaper
# are overridden from the caelestia palette by scripts/sddm-theme.sh.
Current=sddm-astronaut-theme
# The desktop's sweet-cursors lives under ~/.local/share/icons, which the sddm
# user cannot read.
CursorTheme=Adwaita
CursorSize=24

[Users]
RememberLastUser=true
RememberLastSession=true

[General]
# The greeter runs on X11 (SDDM's default). Its keyboard layout comes from
# /etc/X11/xorg.conf.d/00-keyboard.conf, which localectl already manages.
Numlock=none
