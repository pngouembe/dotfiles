font_family family="FiraCode Nerd Font Mono"
bold_font auto
italic_font auto
bold_italic_font auto
window_padding_width 8
confirm_os_window_close 0

# Slight transparency. On the Hyprland host it lands on top of decoration.blur
# (hypr/hyprland.lua), so it reads as frosted; COSMIC has no window blur, so
# there it is plain see-through and wants a value closer to 1.0 over a busy
# wallpaper. dynamic_ lets ctrl+shift+a then > / < tune it live per machine
# without editing this file.
background_opacity 0.92
dynamic_background_opacity yes

# Colours. Noctalia writes themes/noctalia.conf from its kitty template on
# hosts where it runs; themes/catppuccin-mocha.conf is the same palette,
# committed here so kitty is themed without it. Later includes win, so on a
# noctalia host its live theme still takes over. globinclude, so an absent
# noctalia.conf is skipped silently instead of logging a read error.
include themes/catppuccin-mocha.conf
globinclude themes/noctalia.conf

# Per-desktop overrides, keyed on the running session: desktop/COSMIC.conf on a
# COSMIC host, nothing on Hyprland (it draws no titlebars, so it needs none).
# globinclude, so a desktop with no file here — or an XDG_CURRENT_DESKTOP that
# is a colon-joined list — is skipped silently rather than logging a read error.
globinclude desktop/${XDG_CURRENT_DESKTOP}.conf
