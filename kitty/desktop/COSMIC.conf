# COSMIC-only overrides. Selected by the globinclude on ${XDG_CURRENT_DESKTOP}
# in kitty.conf, so this file is read only in a COSMIC session.

# COSMIC draws a server-side titlebar on every window that does not decorate
# itself, which on a terminal is just a wasted strip of chrome. Ask kitty to go
# undecorated so the window is only the cell grid. The window is still movable
# and resizable with COSMIC's super+left / super+right drags.
hide_window_decorations yes
